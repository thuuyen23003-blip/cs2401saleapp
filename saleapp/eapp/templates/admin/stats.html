{% extends 'admin/master.html' %}

{% block body %}
<h1 class="text-center text-success mt-2">THỐNG KÊ & BÁO CÁO</h1>

<div class="row">
    <div class="col-6">
        <table class="table">
            <tr>
                <th>Id</th>
                <th>Tên sản phẩm</th>
                <th>Doanh thu (VNĐ)</th>
            </tr>
            {% for s in stats_by_products %}
            <tr>
                <td>{{ s[0] }}</td>
                <td>{{ s[1] }}</td>
                <td>{{ "{:,}".format(s[2]) }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
    <div class="col-6"></div>
</div>

{% endblock %}
